<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>docx-diff</title>
    <script>
      // The theme before the first paint (src/ui/theme.ts keeps it up to date): the reviewer's
      // choice, else the browser's preference.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('docx-diff:theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      /* The loading modal, inline so it shows before the app's scripts and styles have arrived.
         The app renders the same markup (src/ui/LoadingModal.tsx) until the engine is ready. */
      .loading-modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: rgb(255 255 255 / 85%);
        font-family: system-ui, sans-serif;
        color: #1f2328;
      }
      .loading-modal__box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        min-width: 16rem;
        padding: 1.5rem 2rem;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 8px 24px rgb(31 35 40 / 20%);
      }
      .loading-modal__title {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
      }
      .loading-modal__detail {
        min-height: 1.25em;
        font-size: 0.875rem;
        color: #57606a;
      }
      .loading-modal__spinner {
        width: 2rem;
        height: 2rem;
        border: 3px solid #d0d7de;
        border-top-color: #0969da;
        border-radius: 50%;
        animation: loading-modal-spin 0.8s linear infinite;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        background: #0d1117;
      }
      :root[data-theme='dark'] .loading-modal {
        background: rgb(13 17 23 / 85%);
        color: #e6edf3;
      }
      :root[data-theme='dark'] .loading-modal__box {
        background: #1c2128;
        box-shadow: 0 8px 24px rgb(1 4 9 / 60%);
      }
      :root[data-theme='dark'] .loading-modal__detail {
        color: #8d96a0;
      }
      :root[data-theme='dark'] .loading-modal__spinner {
        border-color: #30363d;
        border-top-color: #4493f8;
      }
      @keyframes loading-modal-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-modal" role="dialog" aria-modal="true" aria-label="Loading" aria-busy="true">
        <div class="loading-modal__box">
          <div class="loading-modal__spinner" aria-hidden="true"></div>
          <p class="loading-modal__title">Loading…</p>
          <div class="loading-modal__detail">Loading the application</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
